<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60" role="img" aria-labelledby="t d">
<title id="t">Linea</title><desc id="d">Linea project</desc>
<style>@font-face{font-family:'CP';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'CP','Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif}
.nm{animation:slide .7s cubic-bezier(.2,.7,.2,1) .1s both}@keyframes slide{from{opacity:0;transform:translateX(-12px)}}
.ln{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="div" x1="0" x2="1"><stop offset="0" stop-color="#FF2E97"/><stop offset=".55" stop-color="#B14CFF" stop-opacity=".7"/><stop offset="1" stop-color="#B14CFF" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feFlood flood-color="#FF2E97" flood-opacity=".8"/><feComposite in2="b" operator="in" result="gl"/><feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<text class="nm" x="0" y="48" font-size="34" font-weight="700" letter-spacing="3" fill="#FF2E97" filter="url(#g)">LINEA</text>
</svg>
